<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404</title>
  <style>
  body { 
  font-family: monospace; 
  text-align: center; 
  padding: 50px; 
  background-color: black;   /* or any color name, hex, or rgb */
  color: white;              /* optional: makes text readable on dark bg */
  }
  img { max-width: 80%; margin-bottom: 20px; }
  #cipherText { 
    color: white;   /* change to any color name or hex code */
    font-size: 1.2em; 
  }
</style>
</head>
<body>
  <img src="404.png" alt="404 image">
  <p id="cipherText"></p>

  <script>
    const phrase = "Page does not exist. Return. Back. Home.";
    function caesarShift(str, amount) {
      return str.replace(/[a-z]/gi, c => {
        const base = c === c.toUpperCase() ? 65 : 97;
        return String.fromCharCode(((c.charCodeAt(0) - base + amount) % 26) + base);
      });
    }
    const shifts = [1, 3, 5, 13]; // variants
    const randomShift = shifts[Math.floor(Math.random() * shifts.length)];
    document.getElementById("cipherText").textContent = caesarShift(phrase, randomShift);
  </script>
</body>
</html>
